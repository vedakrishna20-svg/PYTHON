<!DOCTYPE html>
<html>
<head>
    <title>Font Demonstration</title>

    <style>
        body {
            background-color: lightpink;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        .arial {
            font-family: Arial;
            font-size: 20px;
        }

        .times {
            font-family: "Times New Roman";
            font-size: 25px;
        }

        .courier {
            font-family: "Courier New";
            font-size: 30px;
        }

        .bold {
            font-weight: bold;
        }

        .italic {
            font-style: italic;
        }

        .underline {
            text-decoration: underline;
        }

        .center {
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Font and Text Formatting</h1>

    <h2>Different Font Families</h2>

    <p class="arial">This is Arial font.</p>

    <p class="times">This is Times New Roman font.</p>

    <p class="courier">This is Courier New font.</p>


    <h2>Different Font Weights</h2>

    <p class="bold">This is Bold text.</p>

    <p>This is Normal text.</p>


    <h2>Text Formatting</h2>

    <p class="italic">This is Italic text.</p>

    <p class="underline">This is Underlined text.</p>

    <p class="center">This text is in the Center.</p>

</body>
</html>
